name: CI + Deploy Teacher PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-teacher-pages
  cancel-in-progress: false

env:
  NODE_VERSION: 20

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (teacher)
        run: npx tsc --noEmit -p tsconfig.teacher.json

      - name: Test (teacher)
        run: npx vitest run teacher-app/tests

  deploy:
    name: Deploy Teacher PWA to GitHub Pages
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build teacher PWA
        run: npm run build:teacher
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-teacher/.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
